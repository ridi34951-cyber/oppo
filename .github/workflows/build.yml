name: Build GyroLock Android 13+ Sensor Fallback 2.9.8 APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build GyroLock Android 13+ Sensor Fallback 2.9.8 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_COMPILE_SDK: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install command-line tools directly. This avoids setup-android's
      # sdkmanager request for the obsolete package named "tools".
      - name: Install Android SDK Command-line Tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          TOOLS_DIR="$SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$SDK_ROOT/cmdline-tools" "$RUNNER_TEMP/android-cmdline-tools"
          sudo apt-get update
          sudo apt-get install -y curl unzip
          curl -fL --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/android-commandlinetools.zip"
          unzip -q "$RUNNER_TEMP/android-commandlinetools.zip" \
            -d "$RUNNER_TEMP/android-cmdline-tools"
          mkdir -p "$TOOLS_DIR"
          cp -a "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools/." "$TOOLS_DIR/"
          test -x "$TOOLS_DIR/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$TOOLS_DIR/bin/sdkmanager" --version

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Verify Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
          test -d "$ANDROID_HOME/cmake/3.22.1"
          echo "Android SDK: $ANDROID_HOME"
          cat "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - name: Install Vulkan shader compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/gyrolock_vulkan.cpp

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GyroLock-Android13Plus-SensorFallback-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GyroLock-MotionPhoto-HDR-build-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14
