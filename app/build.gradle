plugins {
    id 'com.android.application'
}
android {
    namespace 'com.ridiitols.gyrolock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ridiitols.gyrolock'
        minSdk 33
        targetSdk 33
        versionCode 34
        versionName '2.9.8-android13-min'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-video:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
}

// Compile GLSL into SPIR-V assets before packaging. GitHub Actions installs glslang-tools.
tasks.register('compileVulkanShaders') {
    inputs.files('src/main/cpp/fullscreen.vert', 'src/main/cpp/stabilize.frag')
    outputs.files('src/main/assets/shaders/fullscreen.vert.spv', 'src/main/assets/shaders/stabilize.frag.spv')
    doLast {
        def shaderDir = file('src/main/assets/shaders')
        shaderDir.mkdirs()
        exec { commandLine 'glslangValidator', '-V', file('src/main/cpp/fullscreen.vert').absolutePath, '-o', file('src/main/assets/shaders/fullscreen.vert.spv').absolutePath }
        exec { commandLine 'glslangValidator', '-V', file('src/main/cpp/stabilize.frag').absolutePath, '-o', file('src/main/assets/shaders/stabilize.frag.spv').absolutePath }
    }
}
tasks.named('preBuild').configure { dependsOn 'compileVulkanShaders' }
